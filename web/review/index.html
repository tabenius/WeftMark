<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="color-scheme" content="dark light">
  <title>WeftMark Review</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#board">Skip to work</a>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">W</span>
      <div>
        <strong>WeftMark</strong>
        <span>review surface</span>
      </div>
    </div>
    <div class="source-actions">
      <span id="source-status" class="source-status" role="status">Connecting…</span>
      <button id="refresh-button" type="button">Refresh</button>
      <label class="file-button" for="file-input">Open projection</label>
      <input id="file-input" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main>
    <section class="overview" aria-labelledby="overview-title">
      <div>
        <p class="eyebrow">Read-only coordination</p>
        <h1 id="overview-title">What needs attention?</h1>
        <p class="lede">Inspect intent, evidence, semantic blockers, review state, and Git lineage without opening an agent transcript.</p>
      </div>
      <dl class="summary" aria-label="Workspace summary">
        <div><dt>Cards</dt><dd id="count-cards">—</dd></div>
        <div><dt>Active claims</dt><dd id="count-claims">—</dd></div>
        <div><dt>Needs attention</dt><dd id="count-attention">—</dd></div>
        <div><dt>Observed</dt><dd id="generated-at">—</dd></div>
      </dl>
    </section>

    <section id="message" class="message" hidden role="alert"></section>

    <section id="board" class="board" aria-label="Change Sets by board lane"></section>
  </main>

  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title">
    <div class="detail-shell">
      <header class="detail-header">
        <div>
          <p id="detail-lane" class="eyebrow"></p>
          <h2 id="detail-title">Change Set</h2>
        </div>
        <button id="close-detail" class="icon-button" type="button" aria-label="Close details">×</button>
      </header>
      <div id="detail-content" class="detail-content"></div>
    </div>
  </dialog>

  <template id="empty-lane-template">
    <p class="empty-lane">No Change Sets in this lane.</p>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
