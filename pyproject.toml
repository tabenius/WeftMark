[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weftmark"
version = "0.0.1"
description = "Vendor-neutral coordination, provenance, evidence, and review for multi-agent software work."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "RAGBAZ" },
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

