[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weftmark"
version = "0.0.1"
description = "Vendor-neutral coordination, provenance, evidence, and review for multi-agent software work."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "RAGBAZ" },
]
dependencies = []

[project.scripts]
weftmark = "weftmark.cli.main:main"
weftmark-mcp = "weftmark.mcp.server:main"
weftmark-tui = "weftmark.tui.app:main"

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]
tui = [
  "textual>=8,<9",
]
test = [
  "pytest>=8,<9",
  "mcp>=2,<3",
  "textual>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
