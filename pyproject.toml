[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weftmark"
version = "0.1.0"
description = "Vendor-neutral coordination, provenance, evidence, and review for multi-agent software work."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "RAGBAZ" },
]
dependencies = ["pyyaml>=6"]

[project.scripts]
weftmark = "weftmark.cli.main:main"
weftmark-mcp = "weftmark.mcp.server:main"
weftmark-tui = "weftmark.tui.app:main"

[project.optional-dependencies]
sqlite = [
  "nostoi>=0.1.1,<0.2",
]
mcp = [
  "mcp>=2,<3",
]
tui = [
  "textual>=8,<9",
]
test = [
  "nostoi>=0.1.1,<0.2",
  "jsonschema>=4.26,<5",
  "pytest>=8,<9",
  "mcp>=2,<3",
  "textual>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

# uv alone consumes these sources; ordinary pip consumers should install the
# published Nostoi wheel first (see docs/INSTALL.md). Do not resolve our package
# name from an unrelated public index. The lock records exact source and hashes.
[tool.uv.sources]
nostoi = [
  { url = "https://dl.ragbaz.cc/v1/nostoi/v0.1.1/nostoi-0.1.1-cp311-abi3-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'" },
  { git = "https://github.com/tabenius/nostoi.git", rev = "e45387189c9d20b51260589c0429936950ac4d93", subdirectory = "bindings/python", marker = "sys_platform != 'linux' or platform_machine != 'x86_64' or implementation_name != 'cpython'" },
]

[tool.weftmark.nostoi-release]
version = "0.1.1"
repository = "tabenius/nostoi"
source-commit = "e45387189c9d20b51260589c0429936950ac4d93"
signing-workflow = "registry-candidate.yml"

[tool.setuptools.package-data]
"weftmark.adapters" = ["sql/*.sql"]

[dependency-groups]
# Keep compatible with requirements-docs.txt for pip-based consumers.
# Single source of truth for release binary bundling; resolved by uv.lock.
build = ["pyinstaller==6.16.0"]
docs = ["WeasyPrint>=68,<69", "CairoSVG>=2.8,<3", "Pillow>=12,<13", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
