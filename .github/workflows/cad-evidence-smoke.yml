name: CAD evidence integration smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/weftmark/application/cad_*.py'
      - 'tests/test_cad_*.py'
      - 'web/review/**'
      - '.github/workflows/cad-evidence-smoke.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/install_nostoi_release.py'
  pull_request:
    paths:
      - 'src/weftmark/application/cad_*.py'
      - 'tests/test_cad_*.py'
      - 'web/review/**'
      - '.github/workflows/cad-evidence-smoke.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/install_nostoi_release.py'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: sigstore/cosign-installer@v3
      - name: Install real Nostoi CLI from signed release
        run: python scripts/install_nostoi_release.py --output "$RUNNER_TEMP/nostoi"
      - run: python -m pip install -e . pytest
      - name: Verify CAD bridge with real Nostoi
        env:
          NOSTOI_BIN: ${{ runner.temp }}/nostoi
        run: python -m pytest tests/test_cad_evidence.py tests/test_cad_verified_intake.py tests/test_cad_inspector.py tests/test_cad_nostoi_live.py
      - run: node --check web/review/app.js
