name: CAD evidence integration smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/weftmark/application/cad_*.py'
      - 'tests/test_cad_*.py'
      - 'web/review/**'
      - '.github/workflows/cad-evidence-smoke.yml'
  pull_request:
    paths:
      - 'src/weftmark/application/cad_*.py'
      - 'tests/test_cad_*.py'
      - 'web/review/**'
      - '.github/workflows/cad-evidence-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_cad_evidence.py tests/test_cad_verified_intake.py tests/test_cad_inspector.py
      - run: node --check web/review/app.js
