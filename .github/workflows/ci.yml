name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    timeout-minutes: 20
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python virtualenv
        run: python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ensure Pandoc is available
        # This runner is self-hosted, and jobs execute with no-new-privileges set, so
        # `sudo apt-get install` cannot work here — it fails with "sudo: The 'no new
        # privileges' flag is set" and takes the whole job with it, which is how the
        # docs build went red for a reason that had nothing to do with the code.
        #
        # A runner's toolchain is the runner operator's job. So pandoc is a documented
        # prerequisite of this host, and this step checks it and says so plainly instead
        # of attempting an install that cannot succeed. It is on the host as of
        # 2026-10-05 (pandoc 3.10.2, apt from kali-rolling; see /root/SBOM-log.md).
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            echo "::error::pandoc is missing on this self-hosted runner. Install it on the runner host (apt install pandoc, or a pinned binary on PATH) rather than from the job: jobs run with no-new-privileges, so sudo cannot elevate here."
            exit 1
          fi
          echo "pandoc $(pandoc --version | head -1 | awk '{print $2}')" 

      - name: Install Python build dependencies
        run: |
          python -m pip install --target "$RUNNER_TEMP/weftmark-uv" "uv==0.12.19"
          echo "$RUNNER_TEMP/weftmark-uv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/weftmark-uv/bin/uv" sync --locked --extra test --group docs --python "$(command -v python)"

      - name: Run runtime test suite
        run: python -m pytest

      - name: Package build and clean-install smoke test
        run: make smoke

      - name: Validate task graph
        run: python scripts/validate_tasks.py

      - name: Validate assurance claims
        run: python scripts/check_assurance_docs.py

      - name: Build figures and logo derivatives
        run: |
          python scripts/build_figures.py
          python scripts/build_logo.py --size 512

      - name: Build self-contained HTML and A5 PDF
        run: python scripts/build_pdf.py

      - name: Verify generated artifacts exist
        run: |
          test -s build/weftmark.html
          test -s build/weftmark_A5.pdf
          test -s assets/generated/weftmark-512.png
          test -s assets/generated/weftmark-512.webp
          test -s assets/generated/weftmark-on-black-512.png
          test -s assets/generated/weftmark-on-black-512.webp
          test -s assets/figures/changeset-lifecycle.png

      - name: Upload documentation build
        uses: actions/upload-artifact@v7
        with:
          name: weftmark-docs
          path: |
            build/weftmark.html
            build/weftmark_A5.pdf
          if-no-files-found: error

  publish-rev0:
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stop when immutable rev0 already exists
        id: snapshot
        shell: bash
        run: |
          if test -s docs/artifacts/weftmark_rev0.html && test -s docs/artifacts/weftmark_rev0.pdf; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python virtualenv
        if: steps.snapshot.outputs.needed == 'true'
        run: python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ensure Pandoc is available
        if: steps.snapshot.outputs.needed == 'true'
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            echo "::error::pandoc is missing on this self-hosted runner; see the note in validate-and-build."
            exit 1
          fi

      - name: Install Python build dependencies
        if: steps.snapshot.outputs.needed == 'true'
        run: |
          python -m pip install --target "$RUNNER_TEMP/weftmark-uv" "uv==0.12.19"
          echo "$RUNNER_TEMP/weftmark-uv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/weftmark-uv/bin/uv" sync --locked --group docs --python "$(command -v python)"

      - name: Build rev0 and raster assets
        if: steps.snapshot.outputs.needed == 'true'
        run: make rev0

      - name: Commit immutable rev0 artifacts
        if: steps.snapshot.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/artifacts assets/figures assets/generated
          git commit -m 'chore(artifacts): publish immutable rev0 build'
          git push
