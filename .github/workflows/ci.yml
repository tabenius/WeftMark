name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: weftmark-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Pandoc and PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev
      - name: Install locked development environment
        run: |
          python -m pip install "uv==0.12.19"
          uv sync --locked --extra test --group docs --python python3.12
      - name: Test full runtime
        run: uv run --locked --extra test --group docs python -m pytest
      - name: Package and clean-install smoke
        run: uv run --locked --extra test --group docs make smoke
      - name: Validate tasks and assurance
        run: |
          uv run --locked --extra test --group docs python scripts/validate_tasks.py
          uv run --locked --extra test --group docs python scripts/check_assurance_docs.py
      - name: Build figures, logo, HTML and PDF
        run: |
          uv run --locked --extra test --group docs python scripts/build_figures.py
          uv run --locked --extra test --group docs python scripts/build_logo.py --size 512
          uv run --locked --extra test --group docs python scripts/build_pdf.py
          test -s build/weftmark.html
          test -s build/weftmark_A5.pdf
          test -s assets/generated/weftmark-512.png
          test -s assets/generated/weftmark-512.webp
          test -s assets/generated/weftmark-on-black-512.png
          test -s assets/generated/weftmark-on-black-512.webp
          test -s assets/figures/changeset-lifecycle.png
      - uses: actions/upload-artifact@v4
        with:
          name: weftmark-docs
          path: |
            build/weftmark.html
            build/weftmark_A5.pdf
          if-no-files-found: error

  linux-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package tooling
        run: |
          python -m pip install "uv==0.12.19"
          uv sync --locked --python python3.12
          uv pip install --python .venv/bin/python "pyinstaller==6.16.0"
      - name: Build executable and deb
        run: uv run --no-sync bash scripts/build_linux_packages.sh
      - name: Verify installed deb and binary
        run: |
          mkdir -p /tmp/weftmark-deb-check
          dpkg-deb -x dist/weftmark_*.deb /tmp/weftmark-deb-check
          /tmp/weftmark-deb-check/usr/bin/weftmark --help >/dev/null
          ./dist/weftmark-*-linux-amd64 --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: weftmark-linux-amd64
          path: |
            dist/*.deb
            dist/*-linux-amd64
          if-no-files-found: error
