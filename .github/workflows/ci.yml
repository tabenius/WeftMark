name: CI

on:
  push:
    branches: [main, 'reconcile/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: weftmark-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Pandoc and PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev
      - name: Install locked development environment
        run: |
          python -m pip install "uv==0.12.19"
          uv sync --locked --extra test --group docs --python python3.12
      - name: Test full runtime
        run: uv run --locked --extra test --group docs python -m pytest
      - name: Package and clean-install smoke
        run: uv run --locked --extra test --group docs make smoke
      - name: Validate tasks and assurance
        run: |
          uv run --locked --extra test --group docs python scripts/validate_tasks.py
          uv run --locked --extra test --group docs python scripts/check_assurance_docs.py
      - name: Build figures, logo, HTML and PDF
        run: |
          uv run --locked --extra test --group docs python scripts/build_figures.py
          uv run --locked --extra test --group docs python scripts/build_logo.py --size 512
          uv run --locked --extra test --group docs python scripts/build_pdf.py
          test -s build/weftmark.html
          test -s build/weftmark_A5.pdf
          test -s assets/generated/weftmark-512.png
          test -s assets/generated/weftmark-512.webp
          test -s assets/generated/weftmark-on-black-512.png
          test -s assets/generated/weftmark-on-black-512.webp
          test -s assets/figures/changeset-lifecycle.png
      - uses: actions/upload-artifact@v4
        with:
          name: weftmark-docs
          path: |
            build/weftmark.html
            build/weftmark_A5.pdf
          if-no-files-found: error

  edge-inspector:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only edge inspector
        working-directory: edge/artifact-inspector
        run: npm test
      - name: Verify Tauri read-only capability boundary
        run: node --test desktop/tauri/security.test.mjs

  linux-packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package tooling
        run: |
          python -m pip install "uv==0.12.19"
          uv sync --locked --extra tui --group build --python python3.12
      - name: Build executable and deb
        run: uv run --no-sync bash scripts/build_linux_packages.sh
      - name: Verify installed deb and binary
        run: uv run --no-sync bash scripts/verify_linux_packages.sh
      - name: Test installation in clean Debian and Ubuntu containers
        run: |
          for base in debian:12-slim ubuntu:24.04; do
            docker run --rm -v "$PWD/dist:/packages:ro" "$base" sh -ec '
              apt-get update -qq
              apt-get install -y -qq /packages/weftmark-cli_*.deb /packages/weftmark-tui_*.deb
              weftmark --help >/dev/null
              weftmark-cli --help >/dev/null
              weftmark-tui --help >/dev/null
            '
          done
      - name: TUI terminal smoke (PTY)
        run: |
          python scripts/smoke_tui_pty.py dist/weftmark-tui
      - uses: actions/upload-artifact@v4
        with:
          name: weftmark-linux-amd64
          path: |
            dist/*.deb
            dist/*-linux-amd64
          if-no-files-found: error
