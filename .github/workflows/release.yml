name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semantic version tag, for example v0.0.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate immutable release ref
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match vX.Y.Z"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false
      - name: Refuse unreviewed or previously published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release tag is not reachable from main"
            exit 1
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already published; releases must not be silently replaced"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install document build system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev
      - name: Restore locked build environment
        run: |
          python -m pip install "uv==0.12.19"
          uv sync --locked --extra test --extra tui --group docs --group build --python python3.12
      - name: Verify tag matches package version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="$(uv run --no-sync python -c 'import weftmark; print(weftmark.__version__)')"
          test "v$version" = "$TAG" || { echo "::error::Tag does not match package version"; exit 1; }
      - name: Run tests and packaging acceptance before publication
        run: uv run --no-sync python -m pytest
      - name: Build distributions, executable, deb and documentation
        run: |
          uv build
          uv run --no-sync bash scripts/build_linux_packages.sh
          uv run --no-sync python scripts/build_figures.py
          uv run --no-sync python scripts/build_logo.py --size 512
          uv run --no-sync python scripts/build_pdf.py
          test -s build/weftmark.html
          test -s build/weftmark_A5.pdf
          cp build/weftmark.html dist/weftmark.html
          cp build/weftmark_A5.pdf dist/weftmark_A5.pdf
      - name: Validate packaged CLI and TUI, generate checksums
        shell: bash
        run: |
          uv run --no-sync bash scripts/verify_linux_packages.sh
          cd dist
          sha256sum *.whl *.tar.gz *.deb *-linux-amd64 *.html *.pdf > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Gate release on clean distro installs and TUI terminal
        shell: bash
        run: |
          set -euo pipefail
          for base in debian:12-slim ubuntu:24.04; do
            docker run --rm -v "$PWD/dist:/packages:ro" "$base" sh -ec '
              apt-get update -qq
              apt-get install -y -qq /packages/weftmark-cli_*.deb /packages/weftmark-tui_*.deb
              weftmark --help >/dev/null
              weftmark-tui --help >/dev/null
            '
          done
          uv run --no-sync python scripts/smoke_tui_pty.py dist/weftmark-tui
      - name: Attest build provenance of release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*-linux-amd64
            dist/*.html
            dist/*.pdf
            dist/SHA256SUMS
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "WeftMark $TAG" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz dist/*.deb dist/*-linux-amd64 \
            dist/weftmark.html dist/weftmark_A5.pdf dist/SHA256SUMS
