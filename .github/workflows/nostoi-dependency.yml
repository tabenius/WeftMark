name: Released Nostoi dependency
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  released-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked resolver
        run: python -m pip install 'uv==0.12.19'
      - name: Core install needs no Nostoi
        run: |
          uv sync --locked
          uv run --no-sync python -c 'import importlib.util; assert importlib.util.find_spec("nostoi") is None'
          uv run --no-sync weftmark --help
      - name: Install SQLite and tests without building Nostoi
        run: uv sync --locked --extra sqlite --extra test --no-build-package nostoi
      - name: Verify actual wheel source and version
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata as metadata
          import json, nostoi, tomllib
          project = tomllib.load(open('pyproject.toml', 'rb'))
          release = project['tool']['weftmark']['nostoi-release']
          package = metadata.distribution('nostoi')
          assert package.version == release['version']
          origin = json.loads(package.read_text('direct_url.json'))
          assert origin['url'] == project['tool']['uv']['sources']['nostoi'][0]['url']
          assert nostoi.verify_jsonl('')['ok']
          print('Using released native wheel:', package.version, origin['url'])
          PY
      - name: Verify compatibility and dependency refusals
        run: |
          uv run --no-sync python -m pytest tests/test_nostoi_dependency.py tests/adapters/test_sqlite_ledger.py tests/contracts/test_sql_ledger.py tests/contracts/test_ledger_port.py
