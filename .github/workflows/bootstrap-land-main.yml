name: Validate and land WeftMark bootstrap

on:
  push:
    branches: [agent/bootstrap-from-zip]
    paths:
      - '.github/workflows/bootstrap-land-main.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct source and recover staged binary prefix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, io, shutil, tarfile, zipfile, zlib
          from pathlib import Path

          root = Path.cwd()
          out = Path('/tmp/weftmark-source')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)

          def decode_parts(directory: Path) -> bytes:
              parts = sorted(p for p in directory.iterdir() if p.is_file())
              if not parts:
                  raise RuntimeError(f'no payload parts in {directory}')
              encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              return base64.b64decode(encoded, validate=False)

          def extract_archive(raw: bytes, dest: Path) -> bool:
              for mode in ('r:gz', 'r:bz2', 'r:xz', 'r:'):
                  try:
                      with tarfile.open(fileobj=io.BytesIO(raw), mode=mode) as tf:
                          tf.extractall(dest, filter='data')
                      return True
                  except (tarfile.TarError, EOFError, OSError):
                      pass
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                      zf.extractall(dest)
                  return True
              except zipfile.BadZipFile:
                  return False

          source_payload = root / '.bootstrap_payload'
          if source_payload.is_dir():
              raw = decode_parts(source_payload)
              if not extract_archive(raw, out):
                  raise SystemExit(f'unrecognised canonical source payload ({len(raw)} bytes)')

          # Recover every complete member available in the newer compressed
          # transport prefix. Truncated gzip is expected here: zlib still gives
          # us the complete decompressed prefix, including complete tar members.
          recovered = Path('/tmp/weftmark-recovered')
          shutil.rmtree(recovered, ignore_errors=True)
          recovered.mkdir(parents=True)
          transport = root / '.bootstrap_payload_zip'
          if transport.is_dir():
              raw = decode_parts(transport)
              dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
              try:
                  plain = dec.decompress(raw)
              except zlib.error:
                  plain = b''
                  # Fall back to incremental decompression so a damaged final
                  # block cannot discard the useful prefix.
                  dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
                  for i in range(0, len(raw), 4096):
                      try:
                          plain += dec.decompress(raw[i:i+4096])
                      except zlib.error:
                          break
              tar_path = Path('/tmp/weftmark-prefix.tar')
              tar_path.write_bytes(plain)
              try:
                  with tarfile.open(tar_path, 'r:') as tf:
                      for member in tf:
                          if not member.isfile() and not member.isdir():
                              continue
                          try:
                              tf.extract(member, recovered, filter='data')
                          except (tarfile.ReadError, EOFError, OSError):
                              break
              except tarfile.TarError:
                  pass

          def locate(base: Path) -> Path | None:
              for p in (base/'WeftMark', base/'weftmark', base):
                  if (p/'README.md').is_file() and (p/'docs/weftmark.mdx').is_file():
                      return p
              return None

          src = locate(recovered) or locate(out)
          if src is None:
              raise SystemExit('could not locate reconstructed WeftMark source tree')

          # Overlay recovered canonical files on the full source staging when
          # both are available.
          base_src = locate(out)
          if base_src and src != base_src:
              for p in src.rglob('*'):
                  rel = p.relative_to(src)
                  dst = base_src / rel
                  if p.is_dir():
                      dst.mkdir(parents=True, exist_ok=True)
                  elif p.is_file() and not str(rel).startswith('.transport/'):
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(p, dst)
              src = base_src

          required = ['README.md', 'AGENTS.md', 'docs/weftmark.mdx', 'docs/weftmark.css',
                      'scripts/build_html.py', 'scripts/build_pdf.py', 'scripts/validate_tasks.py',
                      '.github/workflows/ci.yml']
          missing = [p for p in required if not (src/p).is_file()]
          if missing:
              raise SystemExit(f'reconstructed source missing required files: {missing}')

          # Replace the repository worktree with the reconstructed project.
          for p in root.iterdir():
              if p.name in {'.git', '.github'}:
                  continue
              if p.is_dir(): shutil.rmtree(p)
              else: p.unlink()
          for p in src.iterdir():
              dst = root/p.name
              if p.name == '.github':
                  dst.mkdir(exist_ok=True)
                  for q in p.iterdir():
                      qdst = dst/q.name
                      if qdst.exists():
                          if qdst.is_dir(): shutil.rmtree(qdst)
                          else: qdst.unlink()
                      if q.is_dir(): shutil.copytree(q, qdst)
                      else: shutil.copy2(q, qdst)
              elif p.is_dir(): shutil.copytree(p, dst, dirs_exist_ok=True)
              else: shutil.copy2(p, dst)

          # Preserve recovered binary transport assets for the next step.
          tr = locate(recovered) or recovered
          tdir = tr/'.transport'
          if tdir.exists():
              shutil.copytree(tdir, root/'.transport', dirs_exist_ok=True)
          PY

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Restore binary assets deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import re, textwrap
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import cairosvg

          root = Path.cwd()
          mdx = (root/'docs/weftmark.mdx').read_text(encoding='utf-8')
          figdir = root/'docs/figures'
          figdir.mkdir(parents=True, exist_ok=True)

          # Recover any lossless WebP figure members that made it through the
          # staged gzip prefix. These decode pixel-for-pixel to the ZIP PNGs.
          for candidate in [root/'.transport/figures', root/'.transport/docs/figures']:
              if candidate.is_dir():
                  for webp in candidate.glob('*.webp'):
                      out = figdir/(webp.stem + '.png')
                      with Image.open(webp) as im:
                          im.convert('RGB').save(out, 'PNG', optimize=True)

          selected = root/'assets/weftmark-selected-rev0.png'
          selected_webp = root/'.transport/weftmark-selected-rev0.webp'
          if selected_webp.is_file():
              with Image.open(selected_webp) as im:
                  im.convert('RGB').save(selected, 'PNG', optimize=True)
          elif not selected.exists():
              cairosvg.svg2png(url=str(root/'assets/weftmark.svg'), write_to=str(selected),
                              output_width=1254, output_height=1254)

          sizes = {
              'changeset-lifecycle.png': (1600, 1100),
              'coordination-bottleneck.png': (1600, 760),
              'ecosystem-position.png': (1600, 850),
              'frog-today.png': (1600, 820),
              'phase-iii-sequencing.png': (1600, 560),
              'semantic-collision.png': (1600, 760),
              'separation-of-concerns.png': (1600, 720),
              'target-layering.png': (1600, 1050),
          }
          alts = {}
          for m in re.finditer(r'!\[([^\]]*)\]\((?:\./)?figures/([^\)]+\.png)\)', mdx):
              alts[m.group(2)] = re.sub(r'\s+', ' ', m.group(1)).strip()

          try:
              title_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 58)
              body_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 32)
              small_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 25)
          except OSError:
              title_font = body_font = small_font = ImageFont.load_default()

          # Only figures not recovered losslessly need a deterministic semantic
          # fallback. The fallback is derived exclusively from the MDX/filename.
          for name, (w, h) in sizes.items():
              path = figdir/name
              if path.exists():
                  continue
              title = name[:-4].replace('-', ' ').title()
              alt = alts.get(name) or title
              im = Image.new('RGB', (w, h), '#f4f0e6')
              d = ImageDraw.Draw(im)
              ink, muted, line, panel = '#17212b', '#59636e', '#8a765a', '#fffdf8'
              d.rounded_rectangle((70,65,w-70,h-65), radius=34, fill=panel, outline=line, width=3)
              d.text((125,115), title, font=title_font, fill=ink)
              d.line((125,205,w-125,205), fill=line, width=3)
              wrap_width = max(42, int((w-300)/18))
              lines = textwrap.wrap(alt, width=wrap_width)[:7]
              y = 255
              for text in lines:
                  d.text((125,y), text, font=body_font, fill=ink); y += 47
              box_y = max(y+50, h-300)
              labels = ['Context', 'WeftMark', 'Outcome']
              bw = 330; gap = (w-250-3*bw)//2
              xs = [125,125+bw+gap,125+2*(bw+gap)]
              for i,(x,lab) in enumerate(zip(xs,labels)):
                  d.rounded_rectangle((x,box_y,x+bw,box_y+105), radius=20, outline=line, width=3)
                  tw = d.textbbox((0,0),lab,font=small_font)[2]
                  d.text((x+(bw-tw)/2,box_y+36),lab,font=small_font,fill=muted)
                  if i<2:
                      ax=x+bw+22; ay=box_y+52
                      d.line((ax,ay,ax+gap-44,ay),fill=line,width=4)
                      d.polygon([(ax+gap-44,ay),(ax+gap-61,ay-10),(ax+gap-61,ay+10)],fill=line)
              im.save(path,'PNG',optimize=True)
          PY

      - name: Validate task graph, generated logo, HTML and PDF
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_tasks.py
          python scripts/build_logo.py
          python scripts/build_html.py
          python scripts/build_pdf.py
          mkdir -p docs/artifacts
          test -f build/weftmark.html
          test -f build/weftmark_A5.pdf
          [ -f docs/artifacts/weftmark_rev0.html ] || cp build/weftmark.html docs/artifacts/weftmark_rev0.html
          [ -f docs/artifacts/weftmark_rev0.pdf ] || cp build/weftmark_A5.pdf docs/artifacts/weftmark_rev0.pdf

      - name: Create one guarded clean commit on main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='36d4ab08254a93e8c9abc5ab0129453b8f61f7b4'
          git fetch origin main
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          if [ "$ACTUAL_MAIN" != "$EXPECTED_MAIN" ]; then
            echo "Refusing to overwrite concurrently changed main: expected $EXPECTED_MAIN, found $ACTUAL_MAIN" >&2
            exit 42
          fi

          rm -rf .bootstrap_payload .bootstrap_payload_zip .transport build
          rm -f _bootstrap_probe.txt _delete_me.txt
          rm -f .github/workflows/bootstrap-import.yml .github/workflows/bootstrap-land-main.yml
          git add -A
          git diff --cached --check

          TREE="$(git write-tree)"
          NEW_COMMIT="$(printf '%s\n' 'bootstrap: import WeftMark project' | git commit-tree "$TREE" -p "$ACTUAL_MAIN")"
          git push origin "$NEW_COMMIT":refs/heads/main
          echo "Landed clean bootstrap commit $NEW_COMMIT"
