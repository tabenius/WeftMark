format: weft-task-v0
phase: kanban-integration
summary: Project WeftMark coordination state into a replaceable Kanban-style control surface without moving domain authority into the UI.

tasks:
  - slug: unified-kanban-plan-board
    title: Unify task intent and Change Sets in the Kanban projection
    status: done
    priority: P0
    depends:
      - kanban-read-model-v0
      - native-task-claim-service
      - source-plan-native-import
    purpose: Keep backlog, dependencies and unclaimed work visible beside authoritative Change Set readiness.
    scope:
      files:
        - docs/contracts/kanban-projection-v0.md
        - src/weftmark/application/kanban_projection.py
        - src/weftmark/application/status.py
        - src/weftmark/http/server.py
        - tests/application/test_kanban_projection.py
        - tests/application/test_status.py
        - tests/http/test_server.py
        - tests/web/test_review_surface.py
        - web/review/**
        - tasks/55-kanban-integration.weft.yml
      contracts:
        - contract:unified-kanban-projection-v0
        - surface:kanban-plan-board
    deliverables:
      - Source-labelled native task cards with dependency and conflict context.
      - Explicit native task-to-Change Set links beside unchanged Change Set authority.
      - Read-only HTTP and browser views for both card kinds.
    accept:
      - Unclaimed native tasks remain visible in backlog lanes.
      - Claimed tasks link to Change Sets without copying lifecycle or readiness authority.
      - Existing v0 Change Set card fields and endpoint remain backward compatible.
    negative:
      - Moving or rendering a plan card cannot mutate native task or Change Set state.
      - Imported Frog assignments, locks and status do not become native authority.
      - A missing link or Change Set is shown as attention rather than invented state.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_kanban_projection.py tests/application/test_status.py tests/http/test_server.py tests/web/test_review_surface.py
      - kind: review
        required: true
        criterion: Additive v0 fields preserve old clients and keep plan, claim and Change Set semantics distinct.

  - slug: kanban-read-model-v0
    title: Define the stable read-only Kanban projection
    status: done
    priority: P0
    depends:
      - workspace-status-summary
    purpose: Give Kanban and future mobile clients a small versioned board contract built from authoritative WeftMark status.
    scope:
      files:
        - src/weftmark/application/kanban_projection.py
        - tests/application/test_kanban_projection.py
        - docs/contracts/kanban-projection-v0.md
        - tasks/55-kanban-integration.weft.yml
      contracts:
        - integration:kanban-v0
        - surface:external-board-read-v0
    deliverables:
      - Versioned read-only projection over StatusService.
      - Deterministic mapping to backlog, active, review, ready and done lanes.
      - Attention flags for dirty, stale, failed, unavailable, blocked and evidence-incomplete work.
      - Contract documentation suitable for a separate board client.
    accept:
      - Projection does not read Git or ledger adapters directly.
      - Existing lifecycle and readiness values remain present beside derived board lanes.
      - Unknown future lifecycle states fail safe into review rather than done.
      - Payload consists only of JSON-compatible primitives.
    negative:
      - Projection cannot mutate Change Sets, claims, evidence, reviews, handoffs or Git state.
      - Board lane is never treated as the authoritative lifecycle state.
      - V0 does not invent worker/runtime state absent from StatusService.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_kanban_projection.py
      - kind: test
        required: true
        command: python scripts/validate_tasks.py
      - kind: review
        required: true
        criterion: Contract keeps WeftMark authoritative and the board replaceable.

  - slug: kanban-http-read-surface
    title: Serve the Kanban projection through a minimal local HTTP interface
    status: done
    priority: P1
    depends:
      - kanban-read-model-v0
    purpose: Let a separately deployed Kanban/PWA client consume the same projection without filesystem or SQLite access.
    scope:
      files:
        - src/weftmark/http/**
        - tests/http/**
        - docs/contracts/http-read-v0.md
        - tasks/55-kanban-integration.weft.yml
      contracts:
        - surface:http-read-v0
        - integration:kanban-v0
        - boundary:remote-read-exposure
    deliverables:
      - Read endpoint for workspace projection and individual Change Sets.
      - Explicit schema/version response metadata.
      - Loopback-only v0 binding with optional local bearer-token defense in depth.
      - Remote exposure policy requiring an authenticated TLS proxy or secure tunnel.
    accept:
      - HTTP output is semantically equivalent to the application projection.
      - Read requests never refresh or mutate Change Sets implicitly.
      - Mutation methods are explicitly refused.
      - Health checks and unknown routes do not expose or read workspace state.
    negative:
      - First HTTP slice exposes no mutation endpoint.
      - Non-loopback binding is refused even when a bearer token is configured.
      - V0 does not enable permissive CORS or pretend plaintext bearer auth is secure remote transport.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/http
      - kind: security
        required: true
        criterion: Loopback refusal and remote TLS/authentication boundary reviewed before any remote bind is added.

  - slug: kanban-client-architecture-spike
    title: Map upstream Kanban internals onto the WeftMark projection
    status: done
    priority: P1
    depends:
      - kanban-http-read-surface
      - open-source-license
    purpose: Identify the smallest maintainable integration seam before copying or forking substantial Kanban code.
    scope:
      files:
        - docs/integrations/kanban/**
      contracts:
        - integration:kanban-v0
        - boundary:third-party-code-reuse
    deliverables:
      - Mapping of Kanban task persistence, worktree, PTY, diff, Git and frontend/server boundaries.
      - Recommendation among external adapter, small downstream patch, or reusable component extraction.
      - Apache-2.0 attribution/reuse notes after WeftMark licensing is resolved.
    accept:
      - Spike names exact upstream seams and identifies which state must remain WeftMark-owned.
      - No substantial upstream source is copied merely to complete the spike.
    negative:
      - Kanban persistence cannot become the canonical WeftMark ledger.
      - License compatibility is not assumed before the WeftMark license gate is complete.
    evidence:
      - kind: review
        required: true
        criterion: Integration boundary is smaller than a Kanban fork and keeps upstream replaceable.

  - slug: kanban-scope-collision-projection
    title: Expose semantic scope collisions to board clients
    status: done
    priority: P1
    depends:
      - kanban-read-model-v0
      - semantic-lock-model
    purpose: Surface conflicts that worktree isolation and Git file conflicts cannot detect.
    scope:
      files:
        - src/weftmark/application/status.py
        - src/weftmark/application/kanban_projection.py
        - tests/application/**
        - docs/contracts/kanban-projection-v0.md
        - tasks/55-kanban-integration.weft.yml
      contracts:
        - contract:semantic-lock-v0
        - integration:kanban-v0
    deliverables:
      - Current active-claim blocker summary on Change Set status.
      - Stable scope-collision detail and attention badge in board projection.
    accept:
      - File-disjoint Change Sets declaring the same contract can be shown as conflicting when one currently owns that contract.
      - Collision output identifies only the competing Change Set, claim, and overlapping canonical scopes.
      - Released and expired claims do not remain blockers.
    negative:
      - Board clients do not independently compute semantic collisions.
      - A Change Set is not reported as colliding with its own active claim.
      - Status does not imply that two conflicting claims were both acquired successfully.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_status.py tests/application/test_kanban_projection.py
      - kind: review
        required: true
        criterion: Collision projection matches the existing semantic-lock acquisition/refusal rules.

  - slug: kanban-write-control-bridge
    title: Route board mutations through WeftMark application services
    status: done
    priority: P1
    depends:
      - kanban-client-architecture-spike
      - native-claim-workflow
    purpose: Let reconnecting board/mobile clients claim, release and hand off work without giving the UI direct ledger, Git, lifecycle or runtime authority.
    scope:
      files:
        - src/weftmark/application/control.py
        - src/weftmark/http/control.py
        - src/weftmark/http/server.py
        - tests/application/test_control.py
        - tests/application/test_control_security.py
        - tests/http/**
        - docs/contracts/http-control-v0.md
        - tasks/55-kanban-integration.weft.yml
      contracts:
        - integration:kanban-v0
        - boundary:remote-mutation-authority
        - surface:http-control-v0
    deliverables:
      - Explicit claim, release and clean-head handoff operations routed through existing application services.
      - Durable idempotency request digests and replayable safe results for reconnecting clients.
      - Separate write bearer token with explicitly granted claim, release and handoff capabilities.
      - Strict JSON request schema, body-size limit and coarse stable failure codes without raw provider exception leakage.
    accept:
      - Every mutation passes through existing application services and leaves durable provenance.
      - Reusing an idempotency key for different intent fails closed.
      - Raw client idempotency keys are not persisted in the ledger.
      - Concurrent/retried claims preserve native task and semantic ownership rules.
      - Writes remain disabled unless a control provider, dedicated write token and at least one capability are configured.
      - Loopback-only binding and authenticated TLS proxy/tunnel remote-exposure policy remain unchanged.
    negative:
      - UI code cannot write ledger records, create uncontrolled worktrees, merge, release software, or change lifecycle merely by moving a card lane.
      - Read authorization alone never grants a write capability.
      - Runtime start/stop or provider switching is not exposed until an explicit RuntimePort provider registry exists.
      - Request timestamps cannot be forged by clients.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/http tests/application/test_control.py tests/application/test_control_security.py tests/application/test_task_claims.py
      - kind: security
        required: true
        criterion: Mutation capabilities, idempotency recovery, loopback transport, error disclosure and absence of direct ledger/Git authority are reviewed.
