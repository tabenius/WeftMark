format: weft-task-v0
phase: scope-locks
summary: Move from file collision detection toward semantic coordination.

tasks:
  - slug: semantic-scope-model
    title: Define file, contract, boundary, schema, and surface scopes
    status: done
    priority: P0
    depends:
      - domain-package-skeleton
    purpose: Represent hidden coupling that file paths alone cannot express.
    scope:
      files:
        - src/weftmark/domain/scope.py
        - tests/domain/test_scope.py
      contracts:
        - contract:scope-v0
    deliverables:
      - Typed scope identifiers and normalization rules.
    accept:
      - Canonical forms exist for file, contract, boundary, schema, and surface scopes.
      - Scope comparison is deterministic and serialization-safe.
    negative:
      - Free-form display labels are not used as lock identity.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/domain/test_scope.py

  - slug: semantic-lock-model
    title: Extend lock semantics to contract and boundary scopes
    status: done
    priority: P0
    depends:
      - semantic-scope-model
      - changeset-core-model
    purpose: Prevent two agents from independently changing the same behavior while editing different files.
    scope:
      files:
        - src/weftmark/domain/lock.py
        - tests/domain/test_lock.py
      contracts:
        - contract:semantic-lock-v0
    deliverables:
      - Lease-based semantic lock model tied to agent/session/change set.
      - Conflict computation across scope kinds.
    accept:
      - Exact contract collisions are detected independent of file paths.
      - Lock expiry and explicit release are distinct events.
    negative:
      - An expired lease never grants current ownership.
      - File-disjoint work is not assumed conflict-free when contract scopes overlap.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/domain/test_lock.py

  - slug: scope-audit-service
    title: Audit actual changes against declared file and semantic scopes
    status: done
    priority: P1
    depends:
      - semantic-lock-model
      - git-change-binding
    purpose: Detect scope drift instead of relying on an agent to remember its initial claim.
    scope:
      files:
        - src/weftmark/application/scope_audit.py
        - tests/application/test_scope_audit.py
      contracts:
        - surface:scope-audit
    deliverables:
      - Audit findings for uncovered files and undeclared contract changes.
    accept:
      - File changes outside declared scope are visible as findings.
      - Semantic contract findings can be attached by adapters or reviewers.
    negative:
      - Audit findings do not silently mutate task scope.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_scope_audit.py

  - slug: changeset-scope-amendment
    title: Explicitly widen a claimed Change Set's declared scope
    status: review
    priority: P2
    depends:
      - scope-audit-service
      - native-claim-workflow
    purpose: Let an operator legitimately widen an already-claimed Change Set's scope with an explicit, audited reason, instead of the only recovery being to abandon and re-claim under a different, correctly-scoped task.
    scope:
      files:
        - src/weftmark/domain/changeset.py
        - src/weftmark/application/workspace.py
        - src/weftmark/application/claims.py
        - src/weftmark/cli/main.py
        - tests/domain/test_changeset.py
        - tests/application/test_workspace.py
        - tests/application/test_claims.py
        - tests/cli/test_cli_workflow.py
        - docs/contracts/changeset-scope-amendment-v0.md
        - tasks/20-scope-locks.weft.yml
      contracts:
        - contract:changeset-scope-amendment-v0
    deliverables:
      - An explicit, append-only ScopeAmendment domain event that widens ChangeSet.scopes and records a reason, distinct from Git lineage events.
      - ClaimService.extend_scope() acquires a matching SemanticLock for each added scope (checked for conflicts against every other active claim, exactly like acquire()) before widening the Change Set's declared scope, so a widened declaration is never left lock-unprotected.
      - weftmark scope amend <claim_id> --scope SCOPE [--scope SCOPE ...] --reason "..." --agent --session CLI command, gated on claim ownership.
      - A subsequent scope audit/review immediately sees the widened scope, since both read the persisted ChangeSet.scopes.
    accept:
      - Amending scope only ever adds scopes; it cannot remove or replace an existing declared scope.
      - Re-declaring an already-covered scope is refused rather than silently accepted as a no-op amendment.
      - Amendment history (added scopes, reason, timestamp) is durable and visible on the Change Set.
      - A scope already owned by another active claim is refused with the same ClaimConflict acquire() raises.
    negative:
      - Scope amendment is refused outside the active/review lifecycle states, matching every other lineage-adjacent mutation.
      - Scope amendment never mutates the immutable native TaskIntent that originally declared the claim's scope — only the Change Set's own scope widens.
      - The CLI cannot amend scope without an explicit --reason.
      - ChangeSet.amend_scope()/WorkspaceService.amend_scope() alone (no claim/lock check) are not exposed as an operator-facing entry point; the CLI only reaches scope widening through ClaimService.extend_scope().
      - A caller who is not the claim's owning agent/session cannot amend its scope.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/domain/test_changeset.py tests/application/test_workspace.py tests/application/test_claims.py tests/cli/test_cli_workflow.py
      - kind: security
        required: true
        criterion: Widening declared scope always acquires a matching lock checked against every other active claim first; it cannot be used to declare a scope no lock protects, and it cannot be invoked by a caller who is not the claim's owner.
      - kind: review
        required: true
        criterion: Amendment stays append-only and auditable; it cannot be used to silently launder unrelated changes into an already-claimed Change Set.

  - slug: native-claim-workflow
    title: Persist and operate semantic Change Set claims locally
    status: done
    priority: P0
    depends:
      - semantic-lock-model
      - local-ledger-foundation
      - cli-surface
    purpose: Remove Frog as the lock owner for local WeftMark development.
    scope:
      files:
        - src/weftmark/application/claims.py
        - src/weftmark/cli/main.py
        - tests/application/test_claims.py
        - tests/cli/test_cli_claims.py
      contracts:
        - surface:claim-v0
    deliverables:
      - Atomic multi-scope claim acquisition with overlap refusal.
      - Human and JSON commands for acquire, show, list, renew, and release.
    accept:
      - Concurrent ledger movement cannot bypass scope conflict evaluation.
      - Conflict has a distinct CLI exit code.
    negative:
      - A released or expired claim never blocks new ownership.
      - Claim operations do not write storage directly from CLI code.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_claims.py tests/cli/test_cli_claims.py
