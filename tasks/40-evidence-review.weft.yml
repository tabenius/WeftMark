format: weft-task-v0
phase: evidence-review
summary: Close the loop from intent to proof to a persistent merge decision.

tasks:
  - slug: evidence-policy-model
    title: Define evidence policies per task and Change Set
    status: done
    priority: P0
    depends:
      - evidence-core-model
      - review-decision-model
    purpose: State what must be proven before work becomes reviewable or releasable.
    scope:
      files:
        - src/weftmark/domain/policy.py
        - tests/domain/test_policy.py
      contracts:
        - contract:evidence-policy-v0
    deliverables:
      - Required/optional evidence rules by kind and scope.
      - Policy evaluation result explaining missing, stale, failed, and unavailable proof.
    accept:
      - Policies can require CI, security review, tests, docs, benchmark or deployment evidence.
      - Evaluation is explainable rather than a single boolean.
    negative:
      - Unavailable required evidence cannot be treated as passed.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/domain/test_policy.py

  - slug: local-command-evidence
    title: Capture local command/test evidence
    status: done
    priority: P0
    depends:
      - evidence-core-model
      - git-change-binding
    purpose: Turn local tests into structured proof bound to an exact source revision and environment.
    scope:
      files:
        - src/weftmark/application/evidence_runner.py
        - tests/application/test_evidence_runner.py
      contracts:
        - surface:evidence-run
    deliverables:
      - Command runner with exit status, duration, cwd, environment fingerprint and output artifact references.
    accept:
      - Evidence binds to the current head SHA and becomes stale after source movement.
    negative:
      - Secret environment values are not serialized into evidence records.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_evidence_runner.py
      - kind: security
        required: true
        criterion: Environment capture is reviewed for credential leakage.

  - slug: review-service
    title: Produce reviewer-facing readiness summaries
    status: done
    priority: P0
    depends:
      - evidence-policy-model
      - scope-audit-service
      - git-change-binding
    purpose: Answer what was intended, what changed, what proof exists, and what remains unresolved.
    scope:
      files:
        - src/weftmark/application/review_service.py
        - tests/application/test_review_service.py
      contracts:
        - surface:review-summary-v0
    deliverables:
      - Structured review summary and readiness decision proposal.
    accept:
      - Summary includes declared goal/scope, actual changed paths, contract scopes, lineage, evidence, findings and staleness.
      - Ready, follow-up, blocked, stale and evidence-incomplete outcomes are explainable.
    negative:
      - The service cannot emit READY while an unresolved blocking finding exists.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_review_service.py
      - kind: review
        required: true
        criterion: Output is useful without reading raw agent chat transcripts.

  - slug: docs-assurance-facts
    title: Define machine-readable product assurance facts
    status: done
    priority: P1
    depends:
      - evidence-policy-model
    purpose: Prevent documentation from silently drifting ahead of implemented or verified capability.
    scope:
      files:
        - assurance/**
        - scripts/check_assurance_docs.py
        - README.md
        - ragbaz.component.json
        - .github/workflows/ci.yml
        - tasks/40-evidence-review.weft.yml
      contracts:
        - contract:assurance-facts-v0
        - surface:public-capability-claims
    deliverables:
      - Facts independently recording planned, implemented, verified, reviewed, and releasable state.
      - Generated README assurance snapshot covering at least three implemented capabilities.
      - Validation of selected component-manifest claims against the same facts bundle.
      - CI refusal when facts, evidence references, README snapshot, or manifest claims drift.
    accept:
      - A manifest/document claim can be checked against its supporting fact/evidence state.
      - Verified state requires explicit test/CI evidence rather than following implemented automatically.
      - Reviewed state requires explicit review/security evidence.
      - Releasable state requires verified, reviewed, and release/deployment evidence.
      - Existing stale claims that no runtime exists are corrected without claiming production readiness.
    negative:
      - Implemented is never automatically promoted to verified.
      - Prototype lifecycle is not promoted to production or releasable by this task.
      - Missing local evidence references fail validation.
    evidence:
      - kind: docs
        required: true
        command: python scripts/check_assurance_docs.py
        criterion: README assurance claims and selected component-manifest claims validate from assurance/facts.json.
      - kind: ci
        required: true
        criterion: Assurance validation runs in the normal CI job.
