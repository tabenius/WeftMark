format: weft-task-v0
phase: surfaces
summary: Expose the same application model to humans and agents without duplicating semantics.

tasks:
  - slug: native-task-cli-surface
    title: Expose native task planning CLI
    status: done
    priority: P0
    depends:
      - native-task-ledger-service
      - cli-surface
    purpose: Let operators originate and relate new task intent without Python calls, Frog, or direct ledger edits.
    scope:
      files:
        - src/weftmark/cli/main.py
        - tests/cli/test_cli_tasks.py
        - tasks/50-surfaces.weft.yml
      contracts:
        - surface:cli-native-tasks
    deliverables:
      - Strict task create, show, list and non-terminal transition commands.
      - Strict dependency and conflict add/list commands with human and JSON output.
    accept:
      - Native task records and relations round-trip through a real repository CLI ledger.
      - State filters and relation filters are deterministic.
    negative:
      - CLI cannot mark a task done through the generic transition command.
      - Interface code never writes ledger records directly.
      - Native commands do not invoke Frog or import external authority.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/cli/test_cli_tasks.py
      - kind: review
        required: true
        criterion: Strict grammar and completion refusal are visible at the CLI boundary.

  - slug: native-task-next-service
    title: Select next eligible native task
    status: done
    priority: P0
    depends:
      - native-task-cli-surface
    purpose: Rank newly originated native task intent without reading Frog snapshots or manually interpreting relations.
    scope:
      files:
        - src/weftmark/application/task_planning.py
        - src/weftmark/cli/main.py
        - tests/application/test_task_planning.py
        - tests/cli/test_cli_task_planning.py
        - tasks/50-surfaces.weft.yml
      contracts:
        - contract:native-task-selection-v0
    deliverables:
      - Advisory native eligibility read model over task state, dependencies and active conflicts.
      - Priority-ranked strict task next command with compact explained refusals.
    accept:
      - Only idea and todo tasks with all dependencies done and no in-progress conflict are eligible.
      - Ranking is deterministic by priority, creation time and task identity.
    negative:
      - Selection does not create or transition a task, Change Set or claim.
      - Abandoned dependencies do not count as successfully completed prerequisites.
      - A todo task conflicting with in-progress work is not offered.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_task_planning.py tests/cli/test_cli_task_planning.py
      - kind: review
        required: true
        criterion: Advisory eligibility remains distinct from local ownership and completion authority.

  - slug: native-task-claim-service
    title: Claim eligible native task intent
    status: done
    priority: P0
    depends:
      - native-task-next-service
      - native-claim-workflow
    purpose: Turn selected native intent into owned Change Set work without manually composing multiple commands.
    scope:
      files:
        - src/weftmark/application/task_claims.py
        - src/weftmark/application/task_planning.py
        - src/weftmark/cli/main.py
        - tests/application/test_task_claims.py
        - tests/application/test_task_planning.py
        - tests/cli/test_cli_task_claims.py
        - tasks/50-surfaces.weft.yml
      contracts:
        - contract:native-task-claim-v0
    deliverables:
      - Durable reservation linking one native task to a local Change Set and semantic claim.
      - Retry recovery across Change Set creation, claim acquisition and task transition.
      - Strict task claim CLI command using task-declared scopes.
    accept:
      - Successful claim creates local authority and transitions todo intent to in progress.
      - Identical retry returns the same active Change Set and claim without duplicate writes.
    negative:
      - Ineligible, non-todo or scopeless tasks cannot reserve local work.
      - Conflicting retries cannot change Change Set, claim, actor, session or base identity.
      - Imported Frog locks and assignments are not consulted.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_task_claims.py tests/cli/test_cli_task_claims.py
      - kind: review
        required: true
        criterion: Partial reservation recovery never grants ownership without a native active claim.

  - slug: cli-surface
    title: Implement the first WeftMark CLI
    status: done
    priority: P0
    depends:
      - review-service
      - handoff-core-model
      - semantic-lock-model
      - local-ledger-foundation
    purpose: Give humans a compact local workflow before adding a web interface.
    scope:
      files:
        - src/weftmark/cli/**
        - tests/cli/**
      contracts:
        - surface:cli-v0
    deliverables:
      - Commands for changeset create/show/list, scope, evidence, review, and handoff.
    accept:
      - Human output is readable and each read command has structured JSON output.
      - Exit codes distinguish policy failure, unavailable evidence, and invalid input.
    negative:
      - CLI commands do not bypass application services to write storage directly.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/cli

  - slug: mcp-surface
    title: Expose the application services over MCP
    status: review
    priority: P1
    depends:
      - cli-surface
    purpose: Let coding agents coordinate through the same contracts humans use without granting implicit local execution authority.
    scope:
      files:
        - src/weftmark/mcp/**
        - tests/mcp/**
        - docs/contracts/mcp-v0.md
        - pyproject.toml
        - tasks/50-surfaces.weft.yml
      contracts:
        - surface:mcp-v0
        - boundary:mcp-write-authority
    deliverables:
      - Optional stdio MCP server using the official stable MCP Python SDK v2.
      - Read tools for native tasks, Change Sets, evidence, reviews and handoffs through existing application read models.
      - Explicit process capabilities for claim, release, handoff, scope audit and command-evidence execution.
      - Protocol-level tests using the SDK in-memory client against the real registered tool surface.
    accept:
      - MCP tool results are equivalent to existing application-service serializers/read models.
      - Server is read-only when no write capabilities are granted.
      - Ungranted write tools are absent from tool discovery and also refused by the application facade.
      - Claim, release and handoff mutations reuse the same ControlService/idempotency semantics as HTTP.
      - Command evidence defaults to dry-run, uses the existing safe runner, and accepts no caller-supplied environment variables in v0.
      - V0 serves stdio only; remote MCP transport is not enabled implicitly.
    negative:
      - MCP does not become a second business-logic implementation.
      - MCP tool annotations are never treated as authorization.
      - Ordinary coordination capabilities do not imply command-execution permission.
      - MCP cannot merge/release software or switch runtime providers in v0.
      - V0 does not expose a network MCP listener.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/mcp
      - kind: security
        required: true
        criterion: Read-only default, explicit write capability registration, internal capability recheck, stdio trust boundary and isolated evidence-exec authority are reviewed.

  - slug: workspace-status-summary
    title: Summarize current local coordination records
    status: done
    priority: P0
    depends:
      - cli-surface
      - native-claim-workflow
    purpose: Make current Change Set readiness and ownership visible in one command.
    scope:
      files:
        - src/weftmark/application/status.py
        - src/weftmark/cli/main.py
        - tests/application/test_status.py
        - tests/cli/test_cli_status.py
      contracts:
        - surface:status-v0
    deliverables:
      - Application read model for Change Sets, claims, evidence, reviews, and handoffs.
      - Compact human status and stable JSON output.
    accept:
      - Obsolete review and handoff heads are never presented as current readiness.
      - Status identifies its observed Git head and observation time.
    negative:
      - Status does not silently refresh or mutate historical Change Sets.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_status.py tests/cli/test_cli_status.py

  - slug: generated-local-identifiers
    title: Generate safe local workflow identifiers by default
    status: done
    priority: P0
    depends:
      - cli-surface
    purpose: Remove repetitive identifier invention without weakening explicit automation.
    scope:
      files:
        - src/weftmark/application/identifiers.py
        - src/weftmark/cli/main.py
        - tests/application/test_identifiers.py
        - tests/cli/test_cli_generated_ids.py
      contracts:
        - contract:identifier-v0
    deliverables:
      - Dependency-free, UTC-sortable IDs with random collision space.
      - Generated defaults for Change Sets, claims, evidence, reviews, and handoffs.
    accept:
      - Generated IDs identify their record kind and sort by generation time.
      - Every command continues to accept caller-supplied IDs.
    negative:
      - ID generation does not depend on a network service or machine-local counter.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_identifiers.py tests/cli/test_cli_generated_ids.py

  - slug: terminal-review-ui
    title: Add a compact terminal reviewer view
    status: todo
    priority: P2
    depends:
      - cli-surface
    purpose: Make change/evidence/blocker state glanceable during solo and small-team workflows.
    scope:
      files:
        - src/weftmark/tui/**
      contracts:
        - surface:tui-review-v0
    deliverables:
      - Read-mostly terminal view of Change Sets, evidence and blockers.
    accept:
      - The TUI consumes the same read model as CLI/MCP.
    negative:
      - TUI startup cannot require scanning entire repository trees synchronously.
    evidence:
      - kind: benchmark
        required: true
        criterion: Warm startup remains interactive on a workspace with at least 50 repositories.

  - slug: tablet-web-read-model
    title: Prototype a tablet-friendly read-only review web surface
    status: done
    priority: P2
    depends:
      - cli-surface
      - docs-assurance-facts
    purpose: Explore the product as an evidence/review instrument without prematurely building a full SaaS control plane.
    scope:
      files:
        - web/review/**
        - tests/web/**
        - tasks/50-surfaces.weft.yml
      contracts:
        - surface:web-review-v0
        - integration:kanban-v0
    deliverables:
      - Responsive board and detail views optimized for tablet and phone widths.
      - Live same-origin consumption of `weftmark.kanban-projection.v0`.
      - Exported-projection file mode requiring no API connection or proprietary cloud service.
      - Reviewer views for lifecycle/readiness, evidence, semantic blockers, review/handoff, and Git observation.
    accept:
      - Read-only view can be produced from exported local state.
      - Live mode consumes the existing WeftMark projection rather than Git/ledger state directly.
      - Semantic scope collisions and failed/unavailable/stale evidence remain visible on small screens.
      - Surface has no external JavaScript/CSS dependency and uses touch-sized controls.
    negative:
      - The prototype does not become an alternate source of truth for task or evidence state.
      - The browser client does not issue mutation requests or access Git/ledger files directly.
      - The prototype does not require a proprietary cloud dependency or permissive CORS.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/web/test_review_surface.py
      - kind: review
        required: true
        criterion: Tablet/phone view answers intent, current state, proof, blockers, review, handoff, and lineage questions without agent chat transcripts.
