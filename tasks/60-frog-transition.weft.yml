format: weft-task-v0
phase: frog-transition
summary: Reuse Frog's proven coordination ideas without inheriting accidental environment-specific boundaries.

tasks:
  - slug: frog-state-inventory
    title: Map Frog data and commands to WeftMark concepts
    status: done
    priority: P1
    depends:
      - changeset-core-model
      - evidence-core-model
      - semantic-scope-model
    purpose: Separate reusable lessons from Frog-specific implementation and workspace assumptions.
    scope:
      files:
        - docs/frog-transition.md
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-transition-map-v0
    deliverables:
      - Mapping of Frog tasks, locks, agents, events, repos, workspaces and causality into WeftMark equivalents.
      - Explicit list of concepts that should not migrate.
    accept:
      - Mapping distinguishes semantic reuse from code reuse.
    negative:
      - Frog AGENTS.db schema is not declared the WeftMark runtime schema by default.
    evidence:
      - kind: docs
        required: true
        criterion: Mapping cites current Frog commands and manifest capabilities.

  - slug: frog-plan-importer
    title: Import Frog task-plan data into WeftMark plan/runtime forms
    status: done
    priority: P2
    depends:
      - frog-state-inventory
      - cli-surface
    purpose: Let existing Frog-managed workspaces seed WeftMark without manual task recreation.
    scope:
      files:
        - src/weftmark/adapters/frog.py
        - tests/adapters/test_frog.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - adapter:frog-import-v0
    deliverables:
      - Read-only importer for selected Frog task, relation, repo, agent, file and lock metadata.
      - Schema-pinned source snapshot with canonical digest and capture provenance.
    accept:
      - Import is idempotent and records source identity/version.
    negative:
      - Import never takes write ownership of a live Frog database.
      - Imported task status and locks never become local runtime authority.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/adapters/test_frog.py

  - slug: weftmark-dogfood
    title: Use WeftMark to develop WeftMark
    status: in_progress
    priority: P0
    depends:
      - cli-surface
      - local-command-evidence
      - review-service
    purpose: Replace speculative workflow design with observed use in the project's own development.
    scope:
      files:
        - tasks/**
        - evidence-fixtures/**
        - docs/dogfood-log.md
      contracts:
        - process:dogfood-v0
    deliverables:
      - At least five real Change Sets developed through claim/scope/evidence/review/handoff flows.
      - Recorded friction and resulting design corrections.
    accept:
      - At least one handoff crosses agent/vendor boundaries.
      - At least one unavailable/stale evidence case is observed and handled correctly.
    negative:
      - Dogfood sessions do not waive evidence policy merely because the project is early-stage.
    evidence:
      - kind: review
        required: true
        criterion: Five completed Change Sets and lessons are documented.

  - slug: native-expired-task-claim-recovery
    title: Recover an expired native task claim without losing its binding
    status: done
    priority: P0
    depends:
      - native-task-claim-service
    purpose: Let interrupted workers safely resume bound native tasks after an ordinary lease expiry.
    scope:
      files:
        - src/weftmark/domain/lock.py
        - src/weftmark/application/claims.py
        - src/weftmark/application/task_claims.py
        - tests/domain/test_lock.py
        - tests/application/test_claims.py
        - tests/application/test_task_claims.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:native-task-claim-v1
    deliverables:
      - Owner-only reacquisition of an expired claim through the existing retry-safe task claim workflow.
      - Preserved lease history and atomic scope-conflict checks during reacquisition.
    accept:
      - The original bound agent and session can restore expired authority without changing task, Change Set, or claim identity.
      - Reacquisition records a distinct event and rechecks all current scope owners before granting authority.
    negative:
      - Active, released, foreign, inconsistent, or colliding claims cannot be reacquired.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/domain/test_lock.py tests/application/test_claims.py tests/application/test_task_claims.py
      - kind: review
        required: true
        criterion: Recovery preserves provenance and does not weaken ownership or collision refusal.

  - slug: portable-changeset-bundle
    title: Export and verify portable Change Set records
    status: done
    priority: P0
    depends:
      - cli-surface
      - local-command-evidence
      - handoff-core-model
    purpose: Move exact continuation context between machines without a cloud service.
    scope:
      files:
        - src/weftmark/application/bundle.py
        - src/weftmark/adapters/bundle_file.py
        - src/weftmark/cli/main.py
        - tests/application/test_bundle.py
        - tests/adapters/test_bundle_file.py
        - tests/cli/test_cli_bundle.py
      contracts:
        - contract:portable-bundle-v1
    deliverables:
      - Change Set-scoped export with related claim, evidence, review, and handoff records.
      - Offline canonical-digest verification and private file output.
    accept:
      - Bundle integrity fails closed after any content change.
      - Local repository and worktree locations are absent.
    negative:
      - Raw stdout, stderr, and environment values are never exported.
      - Export does not overwrite an existing file.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_bundle.py tests/adapters/test_bundle_file.py tests/cli/test_cli_bundle.py

  - slug: portable-bundle-receipt
    title: Import verified bundles as read-only external receipts
    status: done
    priority: P0
    depends:
      - portable-changeset-bundle
      - local-ledger-foundation
    purpose: Complete a local sender-to-receiver transport loop without granting foreign records authority over local Change Sets.
    scope:
      files:
        - src/weftmark/application/bundle_import.py
        - src/weftmark/cli/main.py
        - tests/application/test_bundle_import.py
        - tests/cli/test_cli_bundle.py
      contracts:
        - contract:bundle-import-v1
    deliverables:
      - Offline verification that does not initialize Git or open a repository ledger.
      - Atomic idempotent receipt plus list and show commands for verified external bundles.
    accept:
      - Repeated import returns the original ledger sequence without appending a duplicate.
      - A receiver can inspect the complete verified bundle after import.
    negative:
      - Imported bundles do not become authoritative local Change Sets.
      - Tampered bundles are rejected without changing the receiver ledger.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_bundle_import.py tests/cli/test_cli_bundle.py

  - slug: frog-snapshot-receipt-cli
    title: Persist and inspect Frog snapshot receipts
    status: done
    priority: P0
    depends:
      - frog-plan-importer
      - local-ledger-foundation
    purpose: Make existing Frog plan intent locally inspectable through WeftMark without promoting external state into runtime authority.
    scope:
      files:
        - src/weftmark/application/frog_receipts.py
        - src/weftmark/cli/main.py
        - tests/application/test_frog_receipts.py
        - tests/cli/test_cli_frog.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-snapshot-receipt-v0
    deliverables:
      - Atomic idempotent persistence for validated Frog snapshots.
      - CLI snapshot import/list/show and filtered external task listing.
      - Digest-marked redaction of secret-shaped external text before snapshot hashing.
    accept:
      - Repeated import returns the original receipt sequence without appending.
      - Imported tasks can be filtered by source repo path and workflow status.
    negative:
      - Imported task status never creates or transitions a local Change Set.
      - Imported locks never become local active claims.
      - Secret-shaped source prose is never copied raw into the local ledger.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_frog_receipts.py tests/cli/test_cli_frog.py

  - slug: frog-task-promotion
    title: Promote imported Frog task intent into a local Change Set
    status: done
    priority: P0
    depends:
      - frog-snapshot-receipt-cli
    purpose: Continue imported work natively without manually recreating its intent or confusing historical Frog state with local authority.
    scope:
      files:
        - src/weftmark/application/frog_promotions.py
        - src/weftmark/cli/main.py
        - tests/application/test_frog_promotions.py
        - tests/cli/test_cli_frog.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-task-promotion-v0
    deliverables:
      - Explicit, retry-safe promotion from one snapshot task into one new local Change Set.
      - Durable provenance linking the local Change Set to the source snapshot digest, task slug and repository path.
    accept:
      - Repeating the same promotion returns the original local Change Set without duplicating it.
      - The operator declares the local scopes used by the new Change Set.
    negative:
      - Imported workflow status, assignments and locks do not create local lifecycle state, ownership or claims.
      - Conflicting retries cannot silently change the target Change Set ID, base or scopes.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_frog_promotions.py tests/cli/test_cli_frog.py
      - kind: review
        required: true
        criterion: Promotion provenance and authority boundaries are reviewed against docs/frog-transition.md.

  - slug: frog-imported-task-eligibility
    title: Select dependency-eligible imported Frog task intent
    status: done
    priority: P0
    depends:
      - frog-snapshot-receipt-cli
    purpose: Let operators find the next imported task slice without manually interpreting raw status and relation arrays.
    scope:
      files:
        - src/weftmark/application/frog_planning.py
        - src/weftmark/cli/main.py
        - tests/application/test_frog_planning.py
        - tests/cli/test_cli_frog.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-task-eligibility-v0
    deliverables:
      - Advisory dependency and conflict eligibility read model over one immutable Frog snapshot.
      - Priority-ranked strict CLI next command with explained refusal reasons.
    accept:
      - Only exact depends_on relations gate eligibility and all unmet prerequisites are named.
      - Source repo filtering and result limits are deterministic.
    negative:
      - Selection does not create a Change Set or claim.
      - Imported assignments and locks are surfaced as ignored observations, not local authority.
      - Imported Git status is not treated as observed local Git lineage.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_frog_planning.py tests/cli/test_cli_frog.py
      - kind: review
        required: true
        criterion: Eligibility is clearly distinguished from promotion and local claim acquisition.

  - slug: frog-task-claim-workflow
    title: Claim eligible imported Frog task intent natively
    status: done
    priority: P0
    depends:
      - frog-imported-task-eligibility
      - frog-task-promotion
      - native-claim-workflow
    purpose: Turn a selected imported task into locally owned work without manual multi-command recovery.
    scope:
      files:
        - src/weftmark/application/frog_task_claims.py
        - src/weftmark/application/frog_planning.py
        - src/weftmark/cli/main.py
        - tests/application/test_frog_task_claims.py
        - tests/application/test_frog_planning.py
        - tests/cli/test_cli_frog.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-task-claim-v0
    deliverables:
      - Application workflow composing snapshot eligibility, task promotion and native semantic claim acquisition.
      - Strict CLI claim command with generated or explicit local identities and lease duration.
    accept:
      - Retrying after promotion or claim completion returns the same active local authority records.
      - Native semantic scope conflicts still fail atomically at claim acquisition.
    negative:
      - Ineligible imported tasks cannot be promoted by the composed claim workflow.
      - Imported locks and assignments never satisfy local claim ownership.
      - A reused claim with different Change Set, agent or session identity is refused.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_frog_task_claims.py tests/application/test_frog_planning.py tests/cli/test_cli_frog.py
      - kind: review
        required: true
        criterion: Partial completion and retry behavior preserve explicit local authority boundaries.

  - slug: frog-transition-board-projection
    title: Project imported Frog intent into a transition board
    status: review
    priority: P0
    depends:
      - frog-snapshot-receipt-cli
      - frog-imported-task-eligibility
    purpose: Keep Frog backlog intent visible during migration without making legacy assignments or locks authoritative in WeftMark.
    scope:
      files:
        - src/weftmark/application/frog_projection.py
        - tests/application/test_frog_projection.py
        - docs/contracts/frog-transition-projection-v0.md
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-transition-projection-v0
    deliverables:
      - Versioned read-only board payload over one immutable Frog snapshot receipt.
      - Deterministic lanes, dependency/conflict context, observation metadata and freshness state.
    accept:
      - Source task intent is filterable by repository and sorted deterministically.
      - Snapshot digest, capture/import times and staleness are explicit.
    negative:
      - Frog assignments and locks never become WeftMark claims or coordination authority.
      - Unknown source status cannot silently appear complete.
      - Projection never mutates the local ledger.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_frog_projection.py
      - kind: review
        required: true
        criterion: Projection authority and migration boundaries are reviewed against docs/frog-transition.md.

  - slug: source-plan-native-import-core
    title: Import Weft source plans into native TaskService
    status: done
    priority: P0
    depends:
      - native-task-ledger-service
    purpose: Make reviewed task-plan intent usable by native scheduling without waiting for a currently claimed CLI surface.
    scope:
      files:
        - src/weftmark/adapters/weft_plan.py
        - src/weftmark/application/plan_import.py
        - tests/adapters/test_weft_plan.py
        - tests/application/test_plan_import.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:source-plan-import-v0
    deliverables:
      - Bounded, strict parser for the complete weft-task-v0 graph with deterministic source digests.
      - Retry-safe native task, dependency and conflict creation with durable provenance and drift reporting.
    accept:
      - A fresh ledger receives actionable source tasks, native-compatible scopes, dependencies and symmetric conflicts deterministically.
      - Repeating an identical import does not append records or reset native task state.
      - Changed source intent produces an inspectable drift report before mutation.
      - Source-plan done dependencies are recorded as source-satisfied rather than fabricated native completion.
    negative:
      - Source in-progress, blocked, review or done status never manufactures equivalent native runtime authority.
      - Existing native task state and immutable intent are never silently overwritten.
      - YAML aliases, duplicate mapping keys, path escape and unsupported source formats fail closed.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/adapters/test_weft_plan.py tests/application/test_plan_import.py tests/application/test_tasks.py
      - kind: review
        required: true
        criterion: Import provenance, status mapping, partial-retry behavior and drift refusal preserve the source-plan/runtime authority boundary.

  - slug: source-plan-native-import
    title: Expose source-plan import through the native CLI
    status: done
    priority: P0
    depends:
      - source-plan-native-import-core
      - native-task-cli-surface
    purpose: Let a fresh checkout populate its native task ledger from reviewed task files without manual recreation.
    scope:
      files:
        - src/weftmark/adapters/weft_plan.py
        - src/weftmark/application/plan_import.py
        - src/weftmark/cli/main.py
        - tests/adapters/test_weft_plan.py
        - tests/application/test_plan_import.py
        - tests/cli/test_cli_plan_import.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:source-plan-import-v0
        - surface:cli-task-plan
    deliverables:
      - JSON and human-readable plan import and drift inspection commands over the core service.
      - Explicit source label and repository plan-root selection.
    accept:
      - Operators can import tasks/*.weft.yml idempotently and inspect exactly what was created, reused, skipped or drifted.
      - Command output distinguishes source-plan state from native runtime state.
    negative:
      - CLI import never resets an existing task, claims work, or treats source completion as native evidence.
      - Import does not acquire or write Frog locks.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/cli/test_cli_plan_import.py tests/application/test_plan_import.py
      - kind: review
        required: true
        criterion: CLI wording and exit behavior make drift and non-authoritative source statuses explicit.
    notes:
      - Completed from the preserved native reservation after ACP released src/weftmark/cli/main.py.

  - slug: frog-native-task-promotion-core
    title: Promote reviewed Frog snapshots into native TaskService intent
    status: review
    priority: P0
    depends:
      - frog-snapshot-receipt-cli
      - native-task-ledger-service
    purpose: Move selected Frog backlog intent into the native task graph without waiting for a currently claimed CLI surface or importing legacy runtime authority.
    scope:
      files:
        - docs/frog-transition.md
        - src/weftmark/application/frog_task_import.py
        - tests/application/test_frog_task_import.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-native-task-import-v0
    deliverables:
      - Retry-safe application service promoting a reviewed Frog task graph into native tasks, dependencies and conflicts.
      - Durable source label, snapshot digest, selection, scope mapping and terminal-dependency provenance.
    accept:
      - Explicitly selected actionable Frog tasks receive deterministic native intent and operator-declared scopes.
      - Exact retries recover partial creation without duplicating records or resetting native task lifecycle state.
      - Actionable dependency and conflict relations are preserved only when the selected graph is closed.
      - Terminal dependencies are recorded as source-satisfied observations rather than fabricated native completion.
    negative:
      - Frog workflow state other than idea, assignments, locks and Git status never manufacture native runtime authority.
      - Snapshot drift, conflicting existing intent, incomplete relation closure and secret-shaped prose fail before widening native intent.
      - Frog tasks originating from WeftMark cannot be re-imported into a publish/import loop.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_frog_task_import.py tests/application/test_tasks.py
      - kind: review
        required: true
        criterion: Snapshot provenance, graph closure, loop prevention and partial retry behavior preserve the Frog/native authority boundary.

  - slug: frog-native-task-promotion
    title: Expose Frog-to-native task promotion through the CLI
    status: review
    priority: P0
    depends:
      - frog-native-task-promotion-core
      - native-task-cli-surface
    purpose: Let operators explicitly select and map Frog backlog intent into native tasks without manually rebuilding the graph.
    scope:
      files:
        - src/weftmark/application/frog_task_import.py
        - src/weftmark/cli/main.py
        - tests/application/test_frog_task_import.py
        - tests/cli/test_cli_frog.py
        - docs/frog-transition.md
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-native-task-import-v0
        - surface:cli-frog-transition
    deliverables:
      - Strict JSON and human-readable CLI for selected Frog task promotion and scope mapping.
      - Explicit output separating source observations, native intent and later runtime authority.
    accept:
      - Operators can inspect exactly which native tasks and relations were created, reused, skipped or source-satisfied.
      - CLI retries preserve the application service's snapshot and immutable-intent checks.
    negative:
      - CLI promotion never creates a Change Set, acquires a claim, or mutates Frog.
      - CLI convenience cannot bypass relation closure, drift refusal or loop prevention.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/cli/test_cli_frog.py tests/application/test_frog_task_import.py
      - kind: review
        required: true
        criterion: CLI wording makes imported intent and native runtime authority unambiguous.
    notes:
      - Unblocked once the ACP runtime adapter's independent review completed and its claim on src/weftmark/cli/main.py released.
      - Added `weftmark frog task import` (--task repeatable, --scope TASK_SLUG=SCOPE repeatable), mirroring the existing frog task {list,next,claim,promote} CLI pattern.

  - slug: frog-weftmark-parity-report
    title: Compare Frog and WeftMark coordination behavior
    status: in_progress
    priority: P0
    depends:
      - frog-transition-board-projection
      - source-plan-native-import
    purpose: Make the Frog cutover gate depend on observable behavior rather than matching command names or unit-test counts.
    scope:
      files:
        - docs/frog-transition.md
        - src/weftmark/application/frog_parity.py
        - src/weftmark/cli/main.py
        - tests/application/test_frog_parity.py
        - tests/cli/test_cli_frog.py
        - tasks/60-frog-transition.weft.yml
      contracts:
        - contract:frog-weftmark-parity-v0
        - surface:frog-parity-cli
    deliverables:
      - Read-only parity report over one immutable Frog receipt and provenance-bound native state.
      - Explicit match, explained-difference, unavailable and blocker classifications for cutover-relevant checks.
      - Automation-safe CLI exit behavior that blocks cutover while required evidence is unavailable.
    accept:
      - Imported task identity, relations and eligibility are compared without trusting equal slugs as provenance.
      - Paired lease and scope-audit observations are compared when both sides contain enough data.
      - Stale source data, native graph drift and uncovered files are visible blockers.
    negative:
      - Current non-overlap is not presented as proof that either system refused a collision.
      - Frog terminal status is not presented as proof of equivalent finish/evidence/review gates.
      - Producing a report never mutates Frog, native task state, Change Sets, claims or the ledger.
    evidence:
      - kind: test
        required: true
        command: python -m pytest tests/application/test_frog_parity.py tests/cli/test_cli_frog.py
      - kind: review
        required: true
        criterion: Unavailable or temporally incomparable source evidence cannot silently satisfy the Frog cutover gate.
